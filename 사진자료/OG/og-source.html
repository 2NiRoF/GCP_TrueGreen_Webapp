<!DOCTYPE html>
<!-- TrueGreen 링크 미리보기(og) 원본. 브라우저 창을 1200×630으로 열어 캡처하거나 헤드리스 크롬 --screenshot 사용. 결과는 docs/img/og.jpg -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#122a2b;letter-spacing:-0.025em;
 background:url(og-bg-leaf.png) center/cover no-repeat}

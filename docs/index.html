<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>TrueGreen</title>
  <meta name="description" content="친환경 광고 속 주장을 스스로 따져보는 소비자용 그린워싱 진단 가이드">
  <meta property="og:title" content="TrueGreen">
  <meta property="og:description" content="‘친환경’이라는 말, 그대로 믿어도 될까요? 퀴즈와 체크리스트로 확인해 보세요.">
  <!-- 링크 미리보기 그림 (img/og.png, 1200×630). 카카오톡·SNS는 전체 주소만 읽으므로 배포 주소가 바뀌면 아래 두 주소도 바꾸세요 -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://2nirof.github.io/GCP_TrueGreen_Webapp/">
  <meta property="og:image" content="https://2nirof.github.io/GCP_TrueGreen_Webapp/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TrueGreen - 그 ‘친환경’, 누가 확인했나요?">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23178f6b'/%3E%3Cpath d='M10 19c0-6 5-10 12-10-1 7-5 12-11 12' fill='%23e2f1f7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 홈으로 들어올 때만 히어로 사진을 먼저 받기 시작 (다른 페이지로 바로 들어오면 받지 않음)
    // 히어로 사진을 바꾸면 아래 주소도 content.js의 heroPhoto.src와 같게 바꾸세요
    if (!location.hash.replace(/^#\/?/, "")) {
      var hero = document.createElement("link");
      hero.rel = "preload"; hero.as = "image"; hero.href = "img/hero-shelf.jpg"; hero.fetchPriority = "high";
      document.head.appendChild(hero);
    }
  </script>
</head>
<body>
  <a class="skip" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="홈">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" data-site-name>TrueGreen</span>
      </a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="#/learn" data-route="learn">알아보기</a>
        <a href="#/cases" data-route="cases">사례</a>
        <a href="#/quiz" data-route="quiz">퀴즈</a>
        <a href="#/check" data-route="check" class="nav-cta">판독기</a>
        <a href="#/about" data-route="about">소개</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <nav class="footer-nav" aria-label="하단 메뉴">
        <a href="#/">홈</a>
        <a href="#/learn">알아보기</a>
        <a href="#/cases">사례</a>
        <a href="#/quiz">퀴즈</a>
        <a href="#/check">판독기</a>
        <a href="#/about">소개</a>
      </nav>
      <p><strong data-site-name>TrueGreen</strong> · <span data-project></span></p>
      <!-- 문의처: data/config.js의 team.contact / team.instagram 값이 있을 때만 표시 -->
      <p class="small footer-contact" data-contact hidden></p>
      <p class="muted small">이 사이트의 판단 결과는 법적 판단이 아닌 참고용입니다. 퀴즈 속 브랜드는 모두 가상입니다.</p>
    </div>
  </footer>

  <div class="toast" role="status" aria-live="polite"></div>

  <!-- 콘텐츠 데이터: 내용 수정은 data 폴더의 파일만 고치면 됩니다 -->
  <script src="data/config.js"></script>
  <script src="data/content.js"></script>
  <script src="data/cases.js"></script>
  <script src="data/quiz.js"></script>
  <script src="data/checklist.js"></script>
  <!-- 화면 구성 로직 (icons.js: 8대 원칙 아이콘 그림) -->
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
